<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#184c9b" />
    <title>Offline - Wholesale Network Marketplace</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #020617;
        color: #e2e8f0;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      img {
        width: 96px;
        border-radius: 20px;
      }
      p {
        color: #94a3b8;
      }
      button {
        margin-top: 1rem;
        padding: 0.6rem 1.2rem;
        border: 0;
        border-radius: 0.5rem;
        background: #2563eb;
        color: #fff;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="WNMP" />
      <h1>Tidak ada koneksi / No connection</h1>
      <p>Periksa jaringan Anda, lalu coba lagi.<br />Check your network and try again.</p>
      <button onclick="location.reload()">Muat ulang / Reload</button>
    </main>
  </body>
</html>
