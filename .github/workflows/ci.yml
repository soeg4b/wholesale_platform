name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: lint, build, integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wnmp
          POSTGRES_PASSWORD: wnmp
          POSTGRES_DB: wnmp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wnmp -d wnmp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Throwaway CI values only; never reuse them anywhere else.
      NODE_ENV: development
      DATABASE_URL: postgresql://wnmp:wnmp@localhost:5432/wnmp?schema=public
      API_PORT: '4000'
      WEB_ORIGIN: http://localhost:3000
      PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      JWT_ACCESS_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789
      CREDENTIALS_ENCRYPTION_KEY: ci-only-encryption-key-0123456789abcdef01
      ALLOW_PRIVATE_OPERATOR_URLS: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      API: http://localhost:4000/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: >-
          npx prettier --check
          "apps/api/src/**/*.ts" "apps/api/prisma/*.ts"
          "apps/web/app/**/*.tsx" "apps/web/components/**/*.tsx" "apps/web/lib/**/*.{ts,tsx}"
          scripts/smoke.mjs "tests/**/*.mjs"

      - name: Lint (api eslint, web next lint)
        run: npm run lint

      - name: Build API (prisma generate + tsc)
        run: npm run build:api

      - name: Build web (next build)
        run: npm run build:web

      - name: Ensure psql client
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Database schema, SQL constraints and seed
        run: |
          npm run db:push --workspace apps/api
          npm run db:sql --workspace apps/api
          npm run seed --workspace apps/api

      - name: Start API
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          echo $! > api.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/api/health; then echo; exit 0; fi
            sleep 2
          done
          echo "API did not become healthy" >&2
          exit 1

      - name: Smoke test
        run: node scripts/smoke.mjs

      - name: Integration tests
        run: npm test

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            api.log
            npm-debug.log*
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop API
        if: always()
        run: kill "$(cat api.pid)" 2>/dev/null || true

  docker:
    name: docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infra/docker/Dockerfile.api -t wnmp-api:ci .
      - name: Build web image
        run: docker build -f infra/docker/Dockerfile.web -t wnmp-web:ci .

  audit:
    name: npm audit (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Next 14.x has no fixes for new advisories (see 09-security-review.md); surface results without blocking merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
